name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build the web page
        working-directory: web
        run: npm ci && npm run build

      - name: Test
        run: go test ./...

      - name: Build
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir dist
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}" arch="${target#*/}"
            out="dist/muster_${os}_${arch}"
            [ "$os" = windows ] && out="$out.exe"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X github.com/YukiagoTpf/muster/internal/cli.Version=$version" \
              -o "$out" ./cmd/muster
          done
          (cd dist && sha256sum muster_* > checksums.txt)

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
