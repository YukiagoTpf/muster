name: publish

on:
  push:
    tags: ['v*']
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Test
        run: node --test

      - name: Check guardrails
        run: npm run check

      - name: Resolve release
        id: rel
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            BASE=$(node -p "require('./package.json').version")
            VERSION="$BASE-alpha.$(git rev-parse --short HEAD)"
            if npm view "agentswap@$VERSION" version >/dev/null 2>&1; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
            else
              echo "version=$VERSION" >> "$GITHUB_OUTPUT"
              echo "tag=alpha" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Set alpha version
        if: steps.rel.outputs.version != ''
        run: npm version "${{ steps.rel.outputs.version }}" --no-git-tag-version

      - name: Publish
        if: steps.rel.outputs.skip != 'true'
        run: npm publish --tag ${{ steps.rel.outputs.tag || 'latest' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
